name: build-and-push

# 跟随官方 xinxinshuhao-create/lobsterai2api 更新：
# - 每天 UTC 02:00（北京时间 10:00）自动拉取官方最新代码，重建并推送镜像
# - 也可手动 workflow_dispatch 触发
# - 每次构建检测上游 commit，未构建过才重建（省 Actions 额度）
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  # 本仓库改了 Dockerfile / checkin 脚本时也触发重建
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'add-account.sh'
      - 'checkin/**'
      - '.github/workflows/**'

concurrency:
  group: build-and-push
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_SERVER: ghcr.io/${{ github.repository }}/server
  IMAGE_CHECKIN: ghcr.io/${{ github.repository }}/checkin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出本仓库（含 Dockerfile、checkin 脚本）
        uses: actions/checkout@v4
        with:
          path: mine

      - name: 检出官方上游源码
        uses: actions/checkout@v4
        with:
          repository: xinxinshuhao-create/lobsterai2api
          path: upstream
          fetch-depth: 1

      - name: 获取官方最新 commit SHA
        id: sha
        run: echo "value=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 若该 commit 已构建过则跳过（仅定时任务时生效，push/手动触发强制重建）
        id: skip
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          if docker manifest inspect ${IMAGE_SERVER}:${{ steps.sha.outputs.value }} >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 将登录辅助脚本放入构建上下文（Dockerfile 需 COPY）
        if: steps.skip.outputs.skip != 'true'
        run: cp mine/add-account.sh upstream/add-account.sh

      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: steps.skip.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送主服务镜像
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./mine/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_SERVER }}:latest
            ${{ env.IMAGE_SERVER }}:${{ steps.sha.outputs.value }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: 构建并推送签到镜像
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./mine/checkin
          file: ./mine/checkin/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_CHECKIN }}:latest
            ${{ env.IMAGE_CHECKIN }}:${{ steps.sha.outputs.value }}
          cache-from: type=gha,scope=checkin
          cache-to: type=gha,scope=checkin,mode=max

  # 清理 GHCR 旧镜像版本：每个包只保留最近 N 个版本，更旧的删除（降存储/费用）
  cleanup:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 清理旧版本（保留每个包最近 3 个版本）
        shell: bash
        run: |
          set -e
          export REPO="${{ github.repository }}"
          export KEEP=3
          for PKG in "lobsterai2api-docker%2Fserver" "lobsterai2api-docker%2Fcheckin"; do
            export PKG
            echo "=========== 包: $PKG ==========="
            # 按创建时间倒序列出所有版本
            gh api "/repos/$REPO/packages/container/$PKG/versions?per_page=100" \
              --jq '.[] | {id: (.id|tostring), tags: [.metadata.container.tags[]?], created: .created_at}' > /tmp/versions.json 2>/dev/null || true
            COUNT=$(python3 -c "
import json,re
try:
    rows=[l for l in open('/tmp/versions.json').read().splitlines() if l.strip().startswith('{')]
    data=json.loads('['+','.join(rows)+']')
except Exception as e:
    data=[]
print(len(data))
")
            echo "发现 $COUNT 个版本"
            python3 - <<'PYEOF'
import json, subprocess, os
rep = os.environ["REPO"]
pkg = os.environ["PKG"]
keep = int(os.environ["KEEP"])
rows = []
for line in open('/tmp/versions.json').read().splitlines():
    line = line.strip()
    if line.startswith('{'):
        rows.append(line)
data = json.loads('[' + ','.join(rows) + ']') if rows else []
data.sort(key=lambda v: v.get('created') or '', reverse=True)
for v in data[keep:]:
    tags = ','.join(v.get('tags') or [])
    print(f"删除版本 {v['id']} (tags: {tags})")
    subprocess.run(
        ["gh", "api", "-X", "DELETE", f"/repos/{rep}/packages/container/{pkg}/versions/{v['id']}"],
        check=False)
PYEOF
          done